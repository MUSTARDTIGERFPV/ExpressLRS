name: Cleanup stale artifacts
on:
  schedule:
    - cron: "30 2 * * *"

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove stale artifacts from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_REGION: "auto"
        run: |
          if [[ -z $AWS_ACCESS_KEY_ID || -z $AWS_SECRET_ACCESS_KEY || -z $AWS_ENDPOINT_URL ]]; then
            echo "Artifactory credentials are not defined. Most likely action is running from pull request. Not a bug."
            exit 0
          fi

          echo "Generating artifact index"
          aws s3 ls --endpoint-url $AWS_ENDPOINT_URL s3://expresslrs/ExpressLRS/ | grep PRE | awk '{print $2}' | sed s/\\/// > /tmp/artifacts

          git branch --list --remotes --format '%(objectname)' > /tmp/hashes
          git tag --list --format '%(objectname)' >> /tmp/hashes

          for i in `grep -v -f /tmp/hashes /tmp/artifacts`; do
            aws s3 rm --recursive --endpoint-url $AWS_ENDPOINT_URL s3://expresslrs/ExpressLRS/$i
          done

          # Receiver SD-card images live in ExpressLRS-rx-sd/<sha6>/. Keep one only
          # while a full-sha firmware bundle starting with that sha6 survives above.
          aws s3 ls --endpoint-url $AWS_ENDPOINT_URL s3://expresslrs/ExpressLRS/ | grep PRE | awk '{print $2}' | sed 's/\///' > /tmp/remaining || true
          aws s3 ls --endpoint-url $AWS_ENDPOINT_URL s3://expresslrs/ExpressLRS-rx-sd/ | grep PRE | awk '{print $2}' | sed 's/\///' > /tmp/rx-sd || true
          if [ -s /tmp/remaining ]; then
            for i in `grep -E '^[0-9a-f]{6}$' /tmp/rx-sd || true`; do
              if ! grep -q "^$i" /tmp/remaining; then
                aws s3 rm --recursive --endpoint-url $AWS_ENDPOINT_URL s3://expresslrs/ExpressLRS-rx-sd/$i/
              fi
            done
          fi
